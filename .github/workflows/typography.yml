name: Typographie

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tirets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verification des tirets
        run: python tools/check_dashes.py
